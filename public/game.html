<!DOCTYPE html>
<html lang="en" data-theme="dark" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:site_name" content="BensBenchmark">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.bensbenchmark.top/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script>try{var d=document.documentElement,m=localStorage.getItem('bb_motion');d.setAttribute('data-theme',localStorage.getItem('bb_theme')==='light'?'light':'dark');d.setAttribute('data-motion',m==='off'?'off':'on')}catch(e){}</script>
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{URL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{URL}}">
</head>
<body>
<main>
  <section class="detail">
    <div class="wrap">
      <a class="back-link" href="/#games" id="back"></a>
      <div class="detail-grid">
        <div>
          <div class="detail-stage" id="stage"><div class="pv-host" id="stage-host"></div></div>
          <div class="best-line hidden" id="best"></div>
        </div>
        <div class="detail-info" id="info"></div>
      </div>
    </div>
  </section>

  <section class="section section-tint" style="padding-top:50px">
    <div class="wrap">
      <div class="section-head reveal"><div><div class="kicker">Keep playing</div><h2>More games</h2></div>
        <a class="btn btn-ghost btn-sm" href="/#games"><span>All games</span></a></div>
      <div class="game-grid" id="more"></div>
    </div>
  </section>
</main>

<script src="/js/app.js"></script>
<script src="/js/games/chess-pieces.js"></script>
<script src="/js/previews.js"></script>
<script>
(function () {
  var key = location.pathname.split('/').filter(Boolean)[1];
  var g = BB.GAMES[key];
  if (!g) { location.replace('/'); return; }

  document.title = g.name + ' | BensBenchmark';
  document.documentElement.style.setProperty('--tile', g.color);
  document.getElementById('back').innerHTML = BB.ICON.back + ' All games';
  var stage = document.getElementById('stage');
  stage.style.viewTransitionName = 'pv-' + key;
  BB.preview(document.getElementById('stage-host'), key);

  // Which daily ids each game saves under, so the page can say "done today".
  var DAILY_ID = { wordle: 'wordle:5', connections: 'connections', hangman: 'hangman:medium', brillion: 'brillion', pricedle: 'pricedle', greens: 'greens' };

  function modeButton(m, i) {
    var done = m.kind === 'daily' && DAILY_ID[key] && BB.dailyResult(DAILY_ID[key]);
    var sub = done ? 'Done for today. Next one in <span class="countdown-num" data-cd>--:--:--</span>' : m.sub;
    return '<a class="mode-btn reveal' + (i === 0 ? ' primary' : '') + (done ? ' done' : '') + '" href="' + m.href + '" style="--d:' + (160 + i * 70) + 'ms">' +
      '<span class="mode-ico">' + BB.ICON[m.icon] + '</span>' +
      '<span><span class="mode-name">' + m.label + (done ? '<span class="badge done">Played</span>' : '') + '</span>' +
      '<span class="mode-sub">' + sub + '</span></span>' +
      '<span class="go">' + BB.ICON.arrow + '</span></a>';
  }

  function render(plays) {
    var order = BB.rankedGames(plays);
    var rank = order.indexOf(key) + 1;
    var n = plays[key] || 0;
    document.getElementById('info').innerHTML =
      '<div class="row reveal" style="gap:10px">' +
        '<span class="glyph">' + g.glyph + '</span>' +
        '<span class="tag">' + g.tag + '</span>' +
        (g.isNew ? '<span class="tag">New</span>' : '') +
        '<span class="muted" style="font-size:.85rem">#' + rank + ' most played' + (n ? ' &middot; ' + BB.fmtNum(n) + ' plays' : '') + '</span>' +
      '</div>' +
      '<h1 class="reveal mt-2" style="--d:60ms">' + g.name + '</h1>' +
      '<p class="detail-lede reveal mt-1" style="--d:110ms">' + g.about + '</p>' +
      '<div class="modes-pick">' + g.modes.map(modeButton).join('') + '</div>' +
      '<div class="how reveal" style="--d:380ms"><div class="modes-label">How to play</div><ul>' +
        g.how.map(function (h, i) { return '<li><span class="n">' + (i + 1) + '</span><span>' + h + '</span></li>'; }).join('') +
      '</ul></div>';

    document.getElementById('more').innerHTML = order.filter(function (k) { return k !== key; }).slice(0, 4)
      .map(function (k, i) { return BB.gameCard(k, i, { rank: order.indexOf(k) + 1, plays: plays[k] || 0 }); }).join('');
    BB.mountPreviews(document.getElementById('more'));
    BB.wireGlow(document.getElementById('more'));
    BB.initReveal();
    tick();
  }

  function tick() {
    var t = BB.countdownText(BB.msUntilTomorrow());
    document.querySelectorAll('[data-cd]').forEach(function (el) { el.textContent = t; });
  }
  setInterval(tick, 1000);

  BB.withPopularity(render);
  BB.init({ active: 'games' }).then(function () {
    var best = BB.bestFor(key);
    if (best !== undefined && best !== null) {
      var el = document.getElementById('best');
      el.classList.remove('hidden');
      el.innerHTML = '<span class="muted"><span class="crown">' + BB.ICON.crown + '</span>Your best</span><b>' + g.fmt(best) + '</b>';
    }
  });
})();
</script>
</body>
</html>
