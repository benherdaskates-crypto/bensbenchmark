<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangman — BensBenchmark</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23c1662a'/><text y='68' x='50' text-anchor='middle' font-size='52' font-family='Helvetica,sans-serif' font-weight='bold' fill='white'>H</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .hg-top { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .gallows { width: 180px; flex: 0 0 auto; }
  .gallows line, .gallows circle { stroke: var(--text); stroke-width: 5; stroke-linecap: round; fill: none; }
  .gallows .frame { stroke: var(--border-mid); }
  .gallows .part { stroke-dasharray: 200; stroke-dashoffset: 200; opacity: 0; transition: stroke-dashoffset .5s var(--ease), opacity .2s; }
  .gallows .part.show { stroke-dashoffset: 0; opacity: 1; }
  .hg-right { flex: 1 1 230px; min-width: 230px; }
  .hint-box { padding: 12px 15px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; font-size: .9rem; }
  .hint-box b { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 3px; font-weight: 800; }
  .word-line { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 24px 0 2px; }
  .slot {
    width: 28px; height: 40px; display: grid; place-items: center;
    font-size: 1.45rem; font-weight: 700;
    border-bottom: 3px solid var(--border-mid); transition: border-color .3s;
  }
  .slot span { display: inline-block; animation: dropIn .3s var(--ease); }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .slot.miss { border-color: var(--bad); }
  .slot.miss span { color: var(--bad); }
</style>
</head>
<body>
<main>
  <section class="game-shell">
    <div class="wrap" style="max-width:580px" id="mount"></div>
  </section>
</main>

<script src="/js/app.js"></script>
<script src="/js/data.js"></script>
<script src="/js/words.js"></script>
<script src="/js/game-shell.js"></script>
<script>
(function () {
  var KEY = 'hangman';
  var P = new URLSearchParams(location.search);
  var MODE = P.get('mode') === 'infinite' ? 'infinite' : 'daily';
  var MAX_WRONG = 6;

  var store = BB.lsGet('bb_hangman', { streak: 0, played: 0, won: 0 });
  var word = '', hint = '', used = {}, wrong = 0, over = false;
  var cdTimer = null;

  document.getElementById('mount').innerHTML =
    BB.gameHead(KEY, '<button class="btn btn-ghost btn-sm" id="how"><span>How to play</span></button>' +
      (MODE === 'infinite' ? '<button class="btn btn-ghost btn-sm" id="newgame"><span>New word</span></button>' : '')) +
    '<div class="mode-bar">' +
      '<span class="lbl">Mode</span>' +
      '<div class="chips">' +
        '<a class="chip' + (MODE === 'daily' ? ' on' : '') + '" href="?mode=daily">Daily</a>' +
        '<a class="chip' + (MODE === 'infinite' ? ' on' : '') + '" href="?mode=infinite">Endless</a>' +
      '</div>' +
    '</div>' +
    '<div id="banner"></div>' +
    '<div class="stat-row">' + BB.statRow([
      { id: 'st-streak', label: 'Streak', value: store.streak, hl: true },
      { id: 'st-best', label: 'Best', value: '—' },
      { id: 'st-played', label: 'Played', value: store.played },
      { id: 'st-left', label: 'Left', value: MAX_WRONG }
    ]) + '</div>' +
    '<div class="board-area">' +
      '<div class="hg-top">' +
        '<svg class="gallows" viewBox="0 0 200 230" aria-hidden="true">' +
          '<line class="frame" x1="25" y1="215" x2="120" y2="215"/>' +
          '<line class="frame" x1="70" y1="215" x2="70" y2="20"/>' +
          '<line class="frame" x1="70" y1="20" x2="145" y2="20"/>' +
          '<line class="frame" x1="145" y1="20" x2="145" y2="45"/>' +
          '<circle class="part" id="p0" cx="145" cy="66" r="21"/>' +
          '<line class="part" id="p1" x1="145" y1="87" x2="145" y2="150"/>' +
          '<line class="part" id="p2" x1="145" y1="103" x2="117" y2="127"/>' +
          '<line class="part" id="p3" x1="145" y1="103" x2="173" y2="127"/>' +
          '<line class="part" id="p4" x1="145" y1="150" x2="120" y2="192"/>' +
          '<line class="part" id="p5" x1="145" y1="150" x2="170" y2="192"/>' +
        '</svg>' +
        '<div class="hg-right">' +
          '<div class="hint-box"><b>Clue</b><span id="hint"></span></div>' +
          '<div class="mt-2 muted" style="font-size:.83rem" id="letters-used"></div>' +
        '</div>' +
      '</div>' +
      '<div class="word-line" id="word"></div>' +
      '<p class="msg-line" id="msg"></p>' +
      '<div class="keyboard" id="kb"></div>' +
    '</div>';

  var wordEl = document.getElementById('word');
  var msgEl = document.getElementById('msg');

  var KB = [['q','w','e','r','t','y','u','i','o','p'], ['a','s','d','f','g','h','j','k','l'], ['z','x','c','v','b','n','m']];
  document.getElementById('kb').innerHTML = KB.map(function (r) {
    return '<div class="krow">' + r.map(function (k) {
      return '<button class="key" data-k="' + k + '">' + k + '</button>';
    }).join('') + '</div>';
  }).join('');
  document.getElementById('kb').addEventListener('click', function (e) {
    var b = e.target.closest('.key');
    if (b) guess(b.getAttribute('data-k'));
  });

  function banner(html) { document.getElementById('banner').innerHTML = html; }
  function startCountdown() {
    clearInterval(cdTimer);
    function paint() {
      var el = document.getElementById('cd');
      if (!el) return clearInterval(cdTimer);
      el.textContent = BB.countdownText(BB.msUntilTomorrow());
    }
    paint();
    cdTimer = setInterval(paint, 1000);
  }

  function newGame() {
    var pick = MODE === 'daily'
      ? BB.dailyPick(BBDATA.HANGMAN, 'hangman')
      : BBDATA.HANGMAN[Math.floor(Math.random() * BBDATA.HANGMAN.length)];
    word = pick[0]; hint = pick[1];
    used = {}; wrong = 0; over = false;
    document.getElementById('hint').textContent = hint;
    msgEl.textContent = '';
    for (var i = 0; i < MAX_WRONG; i++) document.getElementById('p' + i).classList.remove('show');
    document.querySelectorAll('.key').forEach(function (b) { b.classList.remove('correct', 'absent'); });
    BB.setStat('st-left', MAX_WRONG);
    renderWord(); renderUsed();
  }

  function renderWord() {
    wordEl.innerHTML = word.split('').map(function (ch) {
      var shown = used[ch] || over;
      var missed = over && !used[ch] && !isWin();
      return '<div class="slot' + (missed ? ' miss' : '') + '">' + (shown ? '<span>' + ch + '</span>' : '') + '</div>';
    }).join('');
  }

  function renderUsed() {
    var misses = Object.keys(used).filter(function (c) { return word.indexOf(c) === -1; });
    document.getElementById('letters-used').innerHTML = misses.length
      ? 'Not in the word: <b style="color:var(--bad)">' + misses.join(' ') + '</b>'
      : 'No wrong letters yet.';
  }

  function isWin() { return word.split('').every(function (ch) { return used[ch]; }); }

  function guess(letter) {
    if (over) return;
    var ch = letter.toUpperCase();
    if (used[ch]) return;
    used[ch] = true;
    var btn = document.querySelector('.key[data-k="' + letter.toLowerCase() + '"]');
    var hitIt = word.indexOf(ch) > -1;
    if (btn) btn.classList.add(hitIt ? 'correct' : 'absent');
    if (!hitIt) {
      document.getElementById('p' + wrong).classList.add('show');
      wrong++;
      BB.setStat('st-left', MAX_WRONG - wrong);
    }
    renderWord(); renderUsed();
    if (isWin()) return end(true);
    if (wrong >= MAX_WRONG) return end(false);
  }

  function lockDaily(result) {
    over = true;
    word = result.word; hint = result.hint;
    used = {};
    (result.used || []).forEach(function (c) { used[c] = true; });
    document.getElementById('hint').textContent = hint;
    renderWord(); renderUsed();
    banner('<div class="daily-banner"><b>' + (result.won ? 'Got it' : 'Missed it') + '</b>' +
      '<span class="muted">The word was ' + result.word + '.</span>' +
      '<span style="margin-left:auto">Next in <span class="countdown-num" id="cd">--:--:--</span></span></div>');
    startCountdown();
    msgEl.innerHTML = 'Come back tomorrow, or <a href="?mode=infinite" style="text-decoration:underline">play endless</a>.';
  }

  async function end(won) {
    over = true;
    store.played++;
    if (won) { store.won++; store.streak++; } else { store.streak = 0; }
    BB.lsSet('bb_hangman', store);
    BB.setStat('st-streak', store.streak);
    BB.setStat('st-played', store.played);
    renderWord();

    if (MODE === 'daily') {
      BB.saveDaily(KEY, { won: won, word: word, hint: hint, used: Object.keys(used) });
      banner('<div class="daily-banner"><b>' + (won ? 'Got it' : 'Missed it') + '</b>' +
        '<span style="margin-left:auto">Next in <span class="countdown-num" id="cd">--:--:--</span></span></div>');
      startCountdown();
    }

    var res = won ? await BB.finish(KEY, store.streak, { word: word, mode: MODE }) : { newBest: false };
    BB.setStat('st-best', BB.bestFor(KEY) !== undefined ? BB.bestFor(KEY) : store.streak);

    setTimeout(function () {
      BB.resultPanel({
        game: KEY,
        title: won ? (MAX_WRONG - wrong) + ' guesses to spare' : 'Out of guesses',
        value: won ? store.streak + ' 🔥' : word,
        sub: won ? 'Streak of ' + store.streak + '.' : 'It was <b>' + word + '</b>, ' + hint.toLowerCase() + '.',
        isBest: res.newBest,
        againLabel: MODE === 'daily' ? 'Play endless' : 'Next word',
        onAgain: function () { if (MODE === 'daily') location.href = '?mode=infinite'; else newGame(); }
      });
    }, won ? 400 : 600);
  }

  document.addEventListener('keydown', function (e) {
    if (document.querySelector('.modal-back')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[a-zA-Z]$/.test(e.key)) guess(e.key);
  });

  var ng = document.getElementById('newgame');
  if (ng) ng.addEventListener('click', function () {
    if (!over && Object.keys(used).length && !confirm('Skip this word? Your streak resets.')) return;
    if (!over && Object.keys(used).length) {
      store.streak = 0; store.played++;
      BB.lsSet('bb_hangman', store);
      BB.setStat('st-streak', 0); BB.setStat('st-played', store.played);
    }
    newGame();
  });

  document.getElementById('how').addEventListener('click', function () {
    BB.modal('<button class="modal-close" data-close>' + BB.ICON.x + '</button>' +
      '<h2>How to play</h2>' +
      '<p class="sub">Guess the word a letter at a time. Six wrong and the drawing is finished.</p>' +
      '<div class="mt-3" style="display:grid;gap:8px;font-size:.9rem;color:var(--text-2)">' +
        '<div>Every word comes with a clue.</div>' +
        '<div>Type, or tap the letters.</div>' +
        '<div>Start with vowels, then R, S, T, L, N.</div>' +
      '</div>' +
      '<p class="hint mt-3">Daily is one word for everyone. Endless never runs out.</p>' +
      '<button class="btn btn-block mt-3" data-close><span>Got it</span></button>');
  });

  newGame();

  if (MODE === 'daily') {
    var done = BB.dailyResult(KEY);
    if (done) lockDaily(done);
    else banner('<div class="daily-banner"><b>Daily word #' + BB.puzzleNumber() + '</b>' +
      '<span class="muted">Same word for everyone today</span></div>');
  }

  BB.gameInit(KEY, 'mount', null, function () {
    var b = BB.bestFor(KEY);
    BB.setStat('st-best', b !== undefined ? b : 0);
  });
})();
</script>
</body>
</html>
