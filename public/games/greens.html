<script>try{var d=document.documentElement,m=localStorage.getItem('bb_motion');d.setAttribute('data-theme',localStorage.getItem('bb_theme')==='light'?'light':'dark');d.setAttribute('data-motion',m==='on'||m==='off'?m:(matchMedia('(prefers-reduced-motion: reduce)').matches?'calm':'on'))}catch(e){}</script>
<title>Daily Greens | BensBenchmark</title>
<meta name="description" content="A new nine-hole golf course every day. Aim, time your swing, beat par.">
<link rel="canonical" href="https://www.bensbenchmark.top/games/greens">
</head>
<body>
<main>
  <section class="game-shell">
    <div class="wrap" style="max-width:640px" id="mount"></div>
  </section>
</main>
<script src="/js/app.js"></script>
<script src="/js/game-shell.js"></script>
<script src="/js/games/greens.js"></script>
<script>
  BB.runSolo({ key: 'greens', module: BBG.greens, daily: true, dailyId: 'greens',
    record: function (s) { return BB.submitScore('greens', s); } });
</script>
</body>
