<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence Memory — BensBenchmark</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23159b9b'/><text y='68' x='50' text-anchor='middle' font-size='52' font-family='sans-serif' font-weight='bold' fill='white'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .pad-wrap {
    display: grid; place-items: center;
    padding: clamp(10px, 3vw, 24px) 0 4px;
  }
  .pad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(10px, 2.4vw, 16px);
    width: min(380px, 86vw);
    padding: clamp(12px, 3vw, 20px);
    border-radius: 24px;
    background: var(--bg-tint);
    border: 1px solid var(--border);
  }
  .cell {
    position: relative;
    aspect-ratio: 1;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    overflow: hidden;
    transition: transform .3s var(--ease), background .3s var(--ease),
                border-color .3s var(--ease), box-shadow .3s var(--ease);
  }
  /* a soft sheen so the tiles read as objects, not flat boxes */
  .cell::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,0) 55%);
    opacity: .5; pointer-events: none;
  }
  :root[data-theme="dark"] .cell::before {
    background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,0) 55%);
  }
  .cell:hover { border-color: var(--border-mid); transform: translateY(-2px); }
  .pad-grid.locked .cell { cursor: default; }
  .pad-grid.locked .cell:hover { transform: none; border-color: var(--border); }

  .cell.lit {
    background: var(--tile);
    border-color: var(--tile);
    transform: scale(1.06);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--tile) 24%, transparent),
                0 10px 26px color-mix(in srgb, var(--tile) 32%, transparent);
  }
  .cell.good {
    background: var(--good); border-color: var(--good);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--good) 26%, transparent);
  }
  .cell.bad {
    background: var(--bad); border-color: var(--bad);
    animation: bshake .42s var(--ease-soft);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--bad) 26%, transparent);
  }
  @keyframes bshake { 25%, 75% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }

  /* ripple on tap */
  .cell .ring {
    position: absolute; inset: 0; margin: auto;
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,.55);
    transform: scale(0); opacity: 0;
    pointer-events: none;
  }
  .cell.tapped .ring { animation: ripple .5s var(--ease) forwards; }
  @keyframes ripple {
    0% { transform: scale(0); opacity: .8; }
    100% { transform: scale(13); opacity: 0; }
  }

  /* how far through the pattern you are */
  .beads { display: flex; gap: 6px; justify-content: center; margin-top: 20px; min-height: 10px; flex-wrap: wrap; }
  .bead {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--border);
    transition: background .3s var(--ease), transform .3s var(--ease);
  }
  .bead.on { background: var(--tile); transform: scale(1.3); }

  .stage-note {
    text-align: center; margin-top: 14px; min-height: 24px;
    font-weight: 650; font-size: .95rem; color: var(--text-2);
    transition: color .3s var(--ease);
  }
  .stage-note.watch { color: var(--tile); }

  .startpanel { text-align: center; padding: clamp(24px, 6vw, 44px) 14px; }
  .startpanel h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 4.5vw, 1.9rem); }
  .startpanel p { color: var(--text-2); font-size: .94rem; max-width: 38ch; margin: 10px auto 0; }
  .preview-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px;
    width: 104px; margin: 0 auto 20px;
  }
  .preview-grid i {
    aspect-ratio: 1; border-radius: 7px; background: var(--border);
    animation: demo 2.6s infinite;
  }
  .preview-grid i:nth-child(2) { animation-delay: .35s; }
  .preview-grid i:nth-child(6) { animation-delay: .7s; }
  .preview-grid i:nth-child(8) { animation-delay: 1.05s; }
  @keyframes demo {
    0%, 14%, 100% { background: var(--border); }
    5% { background: var(--tile); }
  }
</style>
</head>
<body>
<main>
  <section class="game-shell">
    <div class="wrap" style="max-width:560px" id="mount"></div>
  </section>
</main>

<script src="/js/app.js"></script>
<script src="/js/game-shell.js"></script>
<script>
(function () {
  var KEY = 'sequence';
  var seq = [], input = [], level = 0, playing = false, accepting = false;

  document.getElementById('mount').innerHTML =
    BB.gameHead(KEY, '<button class="btn btn-ghost btn-sm" id="restart">Restart</button>') +
    '<div class="stat-row">' + BB.statRow([
      { id: 'st-level', label: 'Level', value: 0, hl: true },
      { id: 'st-best', label: 'Best', value: '—' }
    ]) + '</div>' +
    '<div class="board-area">' +
      '<div id="start" class="startpanel">' +
        '<div class="preview-grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>' +
        '<h2>Sequence memory</h2>' +
        '<p>Watch the tiles, then tap them back in order. One more each round.</p>' +
        '<button class="btn mt-3" id="go"><span>Start</span></button>' +
      '</div>' +
      '<div id="play" class="hidden">' +
        '<div class="pad-wrap"><div class="pad-grid" id="grid"></div></div>' +
        '<div class="beads" id="beads"></div>' +
        '<div class="stage-note" id="note"></div>' +
      '</div>' +
    '</div>';

  var gridEl = document.getElementById('grid');
  var note = document.getElementById('note');
  gridEl.innerHTML = Array.from({ length: 9 }, function (_, i) {
    return '<div class="cell" data-i="' + i + '"><span class="ring"></span></div>';
  }).join('');
  var cells = Array.from(gridEl.children);

  function paintBeads() {
    var box = document.getElementById('beads');
    if (!box) return;
    box.innerHTML = seq.map(function (_, i) {
      return '<span class="bead' + (i < input.length ? ' on' : '') + '"></span>';
    }).join('');
  }

  function flash(i, cls, ms) {
    return new Promise(function (res) {
      var c = cells[i];
      BB.sfx[cls === 'bad' ? 'bad' : cls === 'good' ? 'pop' : 'tick']();
      c.classList.add(cls || 'lit');
      setTimeout(function () {
        c.classList.remove(cls || 'lit');
        setTimeout(res, 110);
      }, ms || 380);
    });
  }

  async function nextRound() {
    level++;
    seq.push(Math.floor(Math.random() * 9));
    input = [];
    BB.setStat('st-level', level);
    note.textContent = 'Watch';
    note.classList.add('watch');
    paintBeads();
    playing = true; accepting = false;
    gridEl.classList.add('locked');
    await new Promise(function (r) { setTimeout(r, 560); });
    var speed = Math.max(200, 400 - level * 12);
    for (var i = 0; i < seq.length; i++) await flash(seq[i], 'lit', speed);
    playing = false; accepting = true;
    gridEl.classList.remove('locked');
    note.classList.remove('watch');
    note.textContent = 'Your turn';
  }

  gridEl.addEventListener('click', async function (e) {
    var c = e.target.closest('.cell');
    if (!c || !accepting) return;
    var el = c;
    var i = Number(c.getAttribute('data-i'));
    var step = input.length;

    if (seq[step] !== i) {
      accepting = false;
      await flash(i, 'bad', 460);
      return end();
    }

    input.push(i);
    paintBeads();
    c.classList.add('tapped');
    setTimeout(function () { c.classList.remove('tapped'); }, 520);
    await flash(i, 'good', 170);
    if (input.length === seq.length) {
      accepting = false;
      note.textContent = 'Correct';
      setTimeout(nextRound, 540);
    }
  });

  async function end() {
    var score = level - 1;
    note.textContent = 'Wrong tile. You reached level ' + level + '.';
    var res = await BB.finish(KEY, score, {});
    BB.setStat('st-best', BB.bestFor(KEY));
    BB.resultPanel({
      game: KEY,
      title: 'Level reached',
      value: score,
      sub: score >= 14 ? 'Exceptional.'
        : score >= 10 ? 'Well above average.'
        : score >= 7 ? 'About average.'
        : 'Say the positions out loud.',
      isBest: res.newBest,
      onAgain: start
    });
  }

  function start() {
    document.getElementById('start').classList.add('hidden');
    document.getElementById('play').classList.remove('hidden');
    seq = []; input = []; level = 0;
    BB.setStat('st-level', 0);
    cells.forEach(function (c) { c.className = 'cell'; });
    nextRound();
  }

  document.getElementById('go').addEventListener('click', start);
  document.getElementById('restart').addEventListener('click', start);

  BB.gameInit(KEY, 'mount', null, function () {
    var b = BB.bestFor(KEY);
    BB.setStat('st-best', b !== undefined ? b : 0);
  });
})();
</script>
</body>
</html>
