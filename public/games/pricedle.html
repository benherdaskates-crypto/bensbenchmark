<!DOCTYPE html>
<html lang="en" data-theme="dark" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:site_name" content="BensBenchmark">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.bensbenchmark.top/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script>try{var d=document.documentElement,m=localStorage.getItem('bb_motion');d.setAttribute('data-theme',localStorage.getItem('bb_theme')==='light'?'light':'dark');d.setAttribute('data-motion',m==='on'||m==='off'?m:(matchMedia('(prefers-reduced-motion: reduce)').matches?'calm':'on'))}catch(e){}</script>
<title>Pricedle | BensBenchmark</title>
<meta name="description" content="Guess what a bulk warehouse item costs. Six guesses, within five percent wins.">
<link rel="canonical" href="https://www.bensbenchmark.top/games/pricedle">
</head>
<body>
<main>
  <section class="game-shell">
    <div class="wrap" style="max-width:900px" id="mount"></div>
  </section>
</main>
<script src="/js/app.js"></script>
<script src="/js/game-shell.js"></script>
<script src="/js/games/pricedle-data.js"></script>
<script src="/js/games/pricedle.js"></script>
<script>
  BB.runSolo({ key: 'pricedle', module: BBG.pricedle, daily: true, dailyId: 'pricedle',
    dailyIndex: function () { return PRICEDLE_ITEMS.indexOf(BB.dailyPick(PRICEDLE_ITEMS, 'pricedle')); },
    record: function (s) { return BB.recordStreak('pricedle', s < 7, { guesses: s }).then(function (r) { return r.res; }); } });
</script>
</body>
</html>
