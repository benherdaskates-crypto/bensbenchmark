<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games — BensBenchmark</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23121212'/><text y='66' x='50' text-anchor='middle' font-size='46' font-family='Helvetica,sans-serif' font-weight='bold' fill='white'>BB</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <section class="section">
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <h2>Games</h2>
          <p>Tap the arrow on a card for daily puzzles, word lengths and endless mode.</p>
        </div>
        <div class="tabs" id="filters">
          <button class="on" data-f="all" type="button">All</button>
          <button data-f="Word" type="button">Word</button>
          <button data-f="Speed" type="button">Speed</button>
          <button data-f="Memory" type="button">Memory</button>
        </div>
      </div>
      <div class="card-grid" id="grid"></div>
    </div>
  </section>
</main>

<script src="/js/app.js"></script>
<script>
(function () {
  var keys = Object.keys(BB.GAMES);
  var grid = document.getElementById('grid');

  function render(filter) {
    grid.innerHTML = keys
      .filter(function (k) { return filter === 'all' || BB.GAMES[k].tag === filter; })
      .map(function (k, i) { return BB.gameCard(k, i); })
      .join('');
    BB.wireCards(grid);
    BB.initReveal();
  }

  document.getElementById('filters').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    render(b.getAttribute('data-f'));
  });

  render('all');
  BB.init({ active: 'games' });
})();
</script>
</body>
</html>
